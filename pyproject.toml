[project]
name = "tool-practice"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.29.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]